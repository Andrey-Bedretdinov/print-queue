name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Подпись включается сама, если в секретах репозитория лежит сертификат:
      # CSC_LINK — base64 файла .pfx, CSC_KEY_PASSWORD — пароль к нему.
      # Без них сборка просто остаётся неподписанной.
      - run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: print-queue-windows
          path: |
            release/*.exe
            release/*.zip
            release/latest.yml

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
